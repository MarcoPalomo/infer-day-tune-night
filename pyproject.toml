[project]
name = "idtn"
version = "0.1.0"
description = "Infer by day, tune by night: plateforme SLM autonome sur Kubernetes"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
gateway = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
train = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
  "huggingface_hub>=0.25",
  "kubernetes>=31",
]
cuda = ["bitsandbytes>=0.44"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
idtn = "idtn.conductor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idtn"]

[tool.ruff]
line-length = 100
