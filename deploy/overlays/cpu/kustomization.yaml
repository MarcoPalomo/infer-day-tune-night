apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/inference-llamacpp
patches:
  - target: {kind: Deployment}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: IDTN_PROFILE, value: cpu}
  - target: {kind: CronJob}
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env
        value: [{name: IDTN_PROFILE, value: cpu}]
  - target: {kind: Job}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: IDTN_PROFILE, value: cpu}
