apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/inference-llamacpp
patches:
  - target: {kind: Deployment, name: inference}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/ggml-org/llama.cpp:server-vulkan
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "99"
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/devices.idtn.io~1dri
        value: 1
  - target: {kind: Deployment}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: IDTN_PROFILE, value: apu-vulkan}
  - target: {kind: CronJob}
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env
        value: [{name: IDTN_PROFILE, value: apu-vulkan}]
  - target: {kind: Job}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: IDTN_PROFILE, value: apu-vulkan}
