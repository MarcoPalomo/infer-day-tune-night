apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels:
        app: gateway
        kai.scheduler/queue: idtn-inference
    spec:
      schedulerName: kai-scheduler
      priorityClassName: inference
      containers:
        - name: gateway
          image: idtn/gateway:dev
          ports: [{containerPort: 8080}]
          env:
            - {name: IDTN_UPSTREAM, value: "http://inference:8080"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/idtn}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: idtn-data}
        - name: config
          configMap: {name: idtn-config}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
